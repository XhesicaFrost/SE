version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: takeout_mysql_database
    environment:
      MYSQL_ROOT_PASSWORD: messi030712
      MYSQL_DATABASE: takeout
      MYSQL_USER: takeout_user
      MYSQL_PASSWORD: takeout_pass
    ports:
      - "3307:3306"  # 避免与本地MySQL冲突
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # 可选：初始化脚本
    networks:
      - takeout_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # 后端服务
  backend:
    build:
      context: ./back_end
      dockerfile: Dockerfile
    container_name: takeout_back_end
    ports:
      - "12345:12345"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/takeout?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=messi030712
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - takeout_network
    volumes:
      - backend_uploads:/app/uploads

  # 前端服务
  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
    container_name: takeout_front_end
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - takeout_network

networks:
  takeout_network:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads: