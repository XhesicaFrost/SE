apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -o k8s/
    kompose.version: 1.37.0 (fb0539e64)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\ProgramData\chocolatey\lib\kubernetes-kompose\tools\kompose.exe convert -o k8s/
        kompose.version: 1.37.0 (fb0539e64)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: SPRING_DATASOURCE_PASSWORD
              value: messi030712
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/takeout?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
            - name: SPRING_DATASOURCE_USERNAME
              value: root
          image: backend
          imagePullPolicy: Never
          name: takeout-back-end
          ports:
            - containerPort: 12345
              protocol: TCP
          volumeMounts:
            - mountPath: /app/uploads
              name: backend-uploads
      restartPolicy: Always
      volumes:
        - name: backend-uploads
          persistentVolumeClaim:
            claimName: backend-uploads
